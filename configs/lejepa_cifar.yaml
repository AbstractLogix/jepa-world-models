experiment: lejepa_cifar
seed: 42

data:
  dataset: cifar10
  root: notebooks/data
  image_size: 32
  batch_size: 128
  num_workers: 2

model:
  encoder: resnet18
  embedding_dim: 256
  predictor_hidden_dim: 512

train:
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001

loss:
  lambda_sigreg: 0.1
  target_var: 1.0
  lambda_var: 1.0
  lambda_cov: 0.05
